name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: SNAPSHOT_DIR="$PWD/snapshots" swift test

      - name: Build app
        run: ./build-app.sh --universal

      - name: Zip app
        run: ditto -c -k --keepParent "build/Measuring Tool.app" "build/Measuring-Tool.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Measuring-Tool
          path: build/Measuring-Tool.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore

      # Temporary: print the snapshots into the log so they can be inspected.
      - name: Print snapshots
        if: always()
        run: |
          for f in snapshots/*.png; do
            echo "=====BEGIN $(basename "$f")"
            base64 -b 8000 -i "$f"
            echo "=====END"
          done
